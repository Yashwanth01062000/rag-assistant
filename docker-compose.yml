# Optional: the application uses Qdrant local mode by default, so Docker is not required.
# This file is provided if you later want to switch to a Qdrant server.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
